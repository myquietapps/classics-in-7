<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classics in 7</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Górna sekcja w ramce -->
        <div class="composer-header-card">
            <!-- Nagłówek z zębatką w prawym górnym rogu -->
            <div class="header-top-row">
                <span id="anchor-badge"></span>
                <button id="settings-btn" class="settings-btn" aria-label="Menu ustawień">
                    <svg class="gear-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l-.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </div>

            <!-- Menu rozwijane pod zębatką -->
            <div id="settings-menu" class="settings-menu">
                <a href="#" class="menu-item">Now Playing</a>
                <a href="#" class="menu-item">Saved</a>
                <a href="#" class="menu-item">My Mood Stats</a>
                <a href="#" class="menu-item">Jump to Date</a>
                <a href="#" class="menu-item">Settings</a>
                <a href="#" class="menu-item">About & Support</a>
            </div>

            <h1 id="composer-name">Ładowanie...</h1>
            <p id="composer-meta"></p>
            <p id="event-note" style="display:none;"></p>
        </div>
        
        <!-- Główny utwór w dedykowanej ramce -->
        <div id="main-track-card" class="main-track-card">
            <h3 id="main-track-title" class="main-track-title"></h3>
            
            <div class="main-track-sub-header">
                <div></div>
                <div class="track-right-column">
                    <span id="main-track-duration" class="track-duration"></span>
                    <div id="main-track-moods" class="mood-tags-container-right"></div>
                </div>
            </div>

            <p id="main-track-fact" class="track-fact"></p>
            
            <div id="main-track-actions" class="track-actions">
                <div class="action-row">
                    <button id="btn-1" class="btn-custom btn-1">Button 1</button>
                    <button id="btn-2" class="btn-custom btn-2">Button 2</button>
                </div>
                <div class="action-row">
                    <button id="btn-3" class="btn-custom btn-3">Button 3</button>
                    <button id="btn-4" class="btn-custom btn-4">Button 4</button>
                </div>
            </div>
        </div>

        <!-- Sekcja Discover More (trójkąt w dół ▼) -->
        <div class="discover-more-section">
            <button id="discover-toggle" class="discover-toggle-btn">
                <span>DISCOVER MORE</span>
                <span id="discover-arrow">▼</span>
            </button>
            <div id="discover-content" class="discover-content">
                <div id="tracks-container"></div>
            </div>
        </div>

        <!-- Sekcja Wikipedia (trójkąt z czubkiem w prawo ▶) -->
        <div class="discover-more-section">
            <a id="wiki-link" href="#" target="_blank" class="discover-toggle-btn wiki-link-styled">
                <span>READ MORE ON WIKIPEDIA</span>
                <span class="wiki-arrow">▶</span>
            </a>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
