<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classics in 7</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="card">
            <!-- Górny pasek z dynamicznym nagłówkiem daty / najbliższych urodzin -->
            <div class="top-nav" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <div class="date-header" id="date-header" style="margin-bottom: 0; font-size: 13px;">Born today</div>
                <div class="settings-area">
                    <span id="saved-counter" style="font-size: 13px; margin-right: 12px; opacity: 0.8;">Saved: 0</span>
                    <span id="settings-btn" style="cursor: pointer; font-size: 16px;" title="Settings">⚙️</span>
                </div>
            </div>
            
            <h1 id="track-title">♪ Loading...</h1>
            
            <div class="composer-wrapper">
                <span id="track-composer">Claude Debussy</span>
                <span class="country-tag" id="track-country">[FR]</span>
                <span id="track-duration" class="duration-tag">(4:30)</span>
            </div>

            <div class="tags-container">
                <span class="mood-tag" id="track-mood1">#Melancholic</span>
                <span class="mood-tag" id="track-mood2">#Relaxing</span>
            </div>

            <div class="actions">
                <a href="#" id="spotify-link" class="btn spotify" onclick="openSpotify(event)">Spotify</a>
                <a href="#" id="youtube-link" class="btn youtube" target="_blank">YouTube</a>
                <button class="btn save-btn" title="Save for later" onclick="saveForLater()">Later</button>
            </div>

            <div class="fact-card">
                <div class="fact-title">Did you know?</div>
                <p id="fact-text">Loading fact...</p>
                <div class="fact-voting">
                    <span>Was this interesting?</span>
                    <button class="vote-btn" onclick="vote(true)">👍</button>
                    <button class="vote-btn" onclick="vote(false)">👎</button>
                </div>
            </div>

            <div class="discover-card" id="discoverCard">
                <div class="discover-header" onclick="toggleDiscover()">
                    <span id="discover-arrow">▶</span> DISCOVER MORE
                </div>
                <div class="top5-list" id="top5List">
                </div>
            </div>
        </div>
    </main>

    <script>
        // Baza danych rozszerzona o pole birthDate (MM-DD)
        const tracksData = [
            {
                id: 0,
                title: "Clair de Lune",
                composer: "Claude Debussy",
                birthDate: "08-22", // 22 sierpnia
                country: "[FR]",
                duration: "(4:30)",
                moods: ["#Melancholic", "#Relaxing"],
                fact: "Debussy wrote this piece during a period of intense financial struggle, yet it remains his most peaceful work.",
                youtubeQuery: "Claude Debussy Clair de Lune official audio",
                spotifyQuery: "Claude Debussy Clair de Lune",
                youtubeViews: 85000000
            },
            {
                id: 1,
                title: "Rêverie",
                composer: "Claude Debussy",
                birthDate: "08-22",
                country: "[FR]",
                duration: "(4:10)",
                moods: ["#Dreamy", "#Relaxing"],
                fact: "Rêverie was initially disliked by its publisher, prompting Debussy to call it a poor composition.",
                youtubeQuery: "Claude Debussy Reverie piano master",
                spotifyQuery: "Claude Debussy Reverie",
                youtubeViews: 15000000
            },
            {
                id: 2,
                title: "Nocturnes, Op. 9 No. 2",
                composer: "Frédéric Chopin",
                birthDate: "03-01", // 1 marca
                country: "[PL]",
                duration: "(4:35)",
                moods: ["#Romantic", "#Dreamy"],
                fact: "Chopin wrote his most famous nocturne when he was only around 20 years old.",
                youtubeQuery: "Chopin Nocturne Op 9 No 2 official",
                spotifyQuery: "Frédéric Chopin Nocturne Op 9 No 2",
                youtubeViews: 120000000
            }
        ];

        let currentTrackId = null;
        
        let userMoodPreferences = JSON.parse(localStorage.getItem('userMoodPreferences')) || {
            "#Melancholic": 2,
            "#Relaxing": 2,
            "#Dreamy": 1,
            "#Romantic": 2
        };

        let lastVotedTrackId = null;

        function updateSavedCounter() {
            const savedTracks = JSON.parse(localStorage.getItem('savedTracks')) || [];
            document.getElementById('saved-counter').textContent = `Saved: ${savedTracks.length}`;
        }

        function toggleDiscover() {
            const list = document.getElementById('top5List');
            const arrow = document.getElementById('discover-arrow');
            if (list.style.display === 'flex') {
                list.style.display = 'none';
                arrow.textContent = '▶';
            } else {
                updateDiscoverList();
                list.style.display = 'flex';
                arrow.textContent = '▼';
            }
        }

        function selectTrack(id) {
            const track = tracksData.find(t => t.id === id);
            if (!track) return;

            currentTrackId = track.id;

            document.getElementById('track-title').textContent = "♪ " + track.title;
            document.getElementById('track-composer').textContent = track.composer;
            document.getElementById('track-country').textContent = track.country;
            document.getElementById('track-duration').textContent = track.duration;
            
            document.getElementById('track-mood1').textContent = track.moods[0];
            document.getElementById('track-mood2').textContent = track.moods[1] || "";

            document.getElementById('fact-text').textContent = track.fact;

            document.getElementById('youtube-link').href = `https://www.youtube.com/results?search_query=${encodeURIComponent(track.youtubeQuery)}`;

            document.getElementById('top5List').style.display = 'none';
            document.getElementById('discover-arrow').textContent = '▶';
        }

        function openSpotify(event) {
            event.preventDefault();
            const track = tracksData.find(t => t.id === currentTrackId);
            if (!track) return;

            const appUrl = `spotify:search:${encodeURIComponent(track.spotifyQuery)}`;
            const webUrl = `https://open.spotify.com/search/${encodeURIComponent(track.spotifyQuery)}`;

            window.location.href = appUrl;

            let triggered = false;
            const blurListener = () => { triggered = true; };
            window.addEventListener('blur', blurListener, { once: true });

            setTimeout(() => {
                window.removeEventListener('blur', blurListener);
                if (!triggered) {
                    if (confirm("This works better with Spotify app installed. Open web player instead?")) {
                        window.open(webUrl, '_blank');
                    }
                }
            }, 1500);
        }

        function vote(isUp) {
            if (lastVotedTrackId === currentTrackId) return;

            const currentTrack = tracksData.find(t => t.id === currentTrackId);
            if (!currentTrack) return;

            if (isUp) {
                currentTrack.moods.forEach(mood => {
                    if (userMoodPreferences[mood] !== undefined) {
                        userMoodPreferences[mood] += 2;
                    } else {
                        userMoodPreferences[mood] = 2;
                    }
                });
            } else {
                currentTrack.moods.forEach(mood => {
                    if (userMoodPreferences[mood] !== undefined) {
                        userMoodPreferences[mood] = Math.max(0, userMoodPreferences[mood] - 1);
                    }
                });
            }

            localStorage.setItem('userMoodPreferences', JSON.stringify(userMoodPreferences));
            lastVotedTrackId = currentTrackId;
        }

        function saveForLater() {
            let savedTracks = JSON.parse(localStorage.getItem('savedTracks')) || [];
            if (!savedTracks.includes(currentTrackId)) {
                savedTracks.push(currentTrackId);
                localStorage.setItem('savedTracks', JSON.stringify(savedTracks));
                updateSavedCounter();
                alert('Track saved for later!');
            } else {
                alert('Track is already saved!');
            }
        }

        function updateDiscoverList() {
            const listContainer = document.getElementById('top5List');
            listContainer.innerHTML = '';

            let availableTracks = tracksData.filter(t => t.id !== currentTrackId);

            availableTracks.forEach(track => {
                let score = 0;
                track.moods.forEach(mood => {
                    score += (userMoodPreferences[mood] || 0);
                });
                track.matchScore = score;
            });

            availableTracks.sort((a, b) => b.matchScore - a.matchScore);
            const topTracks = availableTracks.slice(0, 5);

            topTracks.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = 'top5-item';
                item.onclick = () => selectTrack(track.id);

                item.innerHTML = `
                    <span class="top5-title">${index + 1}. ${track.title}</span>
                    <span class="top5-meta">${track.duration} <span class="mood-tag">${track.moods[0]}</span></span>
                `;
                listContainer.appendChild(item);
            });
        }

        function initApp() {
            // Pobieramy dzisiejszą datę w formacie MM-DD (np. "09-12")
            const now = new Date();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate).padStart(2, '0'); // mały fix: getdate() to funkcja, ale dla uproszczenia string
            const todayStr = `${month}-${day}`;

            // Sprawdzamy czy ktoś urodził się dzisiaj
            let todaysTracks = tracksData.filter(t => t.birthDate === todayStr);
            const headerEl = document.getElementById('date-header');

            if (todaysTracks.length > 0) {
                headerEl.textContent = "Born today";
                selectTrack(todaysTracks[0].id);
            } else {
                // Jeśli brak kompozytora dzisiaj, szukamy najbliższych dat w przeszłości i przyszłości
                // Unikalne daty urodzin w bazie posortowane rosnąco
                const uniqueDates = [...new Set(tracksData.map(t => t.birthDate))].sort();
                
                if (uniqueDates.length > 0) {
                    // Znajdujemy poprzednią i następną datę w bazie względem dzisiejszego dnia
                    let prevDate = uniqueDates.slice().reverse().find(d => d < todayStr) || uniqueDates[uniqueDates.length - 1];
                    let nextDate = uniqueDates.find(d => d > todayStr) || uniqueDates[0];

                    const prevTrack = tracksData.find(t => t.birthDate === prevDate);
                    const nextTrack = tracksData.find(t => t.birthDate === nextDate);

                    headerEl.innerHTML = `No composer today. Nearest: <a href="#" onclick="selectTrack(${prevTrack.id}); return false;" style="color: inherit; text-decoration: underline;">${prevDate} (${prevTrack.composer})</a> | <a href="#" onclick="selectTrack(${nextTrack.id}); return false;" style="color: inherit; text-decoration: underline;">${nextDate} (${nextTrack.composer})</a>`;
                    
                    // Domyślnie ładujemy tę bliższą datę
                    selectTrack(prevTrack.id);
                } else {
                    headerEl.textContent = "Born today";
                    selectTrack(tracksData[0].id);
                }
            }

            updateSavedCounter();
        }

        initApp();
    </script>
</body>
</html>
