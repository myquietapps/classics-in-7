<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classics in 7</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <span id="anchor-badge"></span>
        <h1 id="composer-name">Ładowanie...</h1>
        <p id="composer-meta"></p>
        <p id="event-note" style="display:none;"></p>
        
        <!-- Główny utwór (#1) w dedykowanej ramce -->
        <div id="main-track-card" class="main-track-card">
            <div class="track-header">
                <span id="main-track-rank" class="track-rank">#1</span>
                <h3 id="main-track-title" class="track-title"></h3>
            </div>
            <div id="main-track-moods" class="mood-tags-container"></div>
            <p id="main-track-fact" class="track-fact"></p>
            <div id="main-track-actions" class="track-actions">
                <!-- Przyciski streamingowe tylko dla głównego utworu -->
            </div>
        </div>

        <!-- Sekcja Discover More (Rozwijana lista utworów 2-6) -->
        <div class="discover-more-section">
            <button id="discover-toggle" class="discover-toggle-btn">
                <span id="discover-arrow">▼</span> DISCOVER MORE
            </button>
            <div id="discover-content" class="discover-content">
                <div id="tracks-container">
                    <!-- Tutaj JavaScript wstrzyknie utwory 2-6 -->
                </div>
            </div>
        </div>

        <!-- Sekcja Explore Wikipedia ze znaczkiem linku zewnętrznego -->
        <div class="discover-more-section">
            <a id="wiki-link" href="#" target="_blank" class="discover-toggle-btn wiki-link-styled">
                <span>↗</span> EXPLORE WIKIPEDIA
            </a>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
