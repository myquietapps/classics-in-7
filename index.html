<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classics in 7</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Górny pasek z logo i zębatką po prawej -->
        <header class="app-header">
            <span class="app-brand-title">Classics in 7</span>
            <div class="settings-menu-container" style="position: relative;">
                <button id="settings-btn" class="settings-btn" aria-label="Ustawienia">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
                    </svg>
                </button>
                <nav id="dropdown-menu" class="dropdown-menu">
                    <ul>
                        <li><a href="#">Menu_1</a></li>
                        <li><a href="#">Menu_2</a></li>
                        <li><a href="#">Menu_3</a></li>
                        <li><a href="#">Menu_4</a></li>
                        <li><a href="#">Menu_5</a></li>
                        <li><a href="#">Menu_6</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <!-- Górna sekcja w ramce (Kompozytor) -->
        <div class="composer-header-card">
            <span id="anchor-badge"></span>
            <h1 id="composer-name">Ładowanie...</h1>
            <p id="composer-meta"></p>
            <p id="event-note" style="display:none;"></p>
        </div>
        
        <!-- Główny utwór w dedykowanej ramce -->
        <div id="main-track-card" class="main-track-card">
            <h3 id="main-track-title" class="main-track-title"></h3>
            
            <div class="main-track-sub-header">
                <div></div>
                <div class="track-right-column">
                    <span id="main-track-duration" class="track-duration"></span>
                    <div id="main-track-moods" class="mood-tags-container-right"></div>
                </div>
            </div>

            <p id="main-track-fact" class="track-fact"></p>
            
            <div id="main-track-actions" class="track-actions">
                <div class="action-row">
                    <button id="btn-1" class="btn-custom btn-1">Button 1</button>
                    <button id="btn-2" class="btn-custom btn-2">Button 2</button>
                </div>
                <div class="action-row">
                    <button id="btn-3" class="btn-custom btn-3">Button 3</button>
                    <button id="btn-4" class="btn-custom btn-4">Button 4</button>
                </div>
            </div>
        </div>

        <!-- Sekcja Discover More -->
        <div class="discover-more-section">
            <button id="discover-toggle" class="discover-toggle-btn">
                <span>DISCOVER MORE</span>
                <span id="discover-arrow">▼</span>
            </button>
            <div id="discover-content" class="discover-content">
                <div id="tracks-container"></div>
            </div>
        </div>

        <!-- Sekcja Explore Wikipedia -->
        <div class="discover-more-section">
            <a id="wiki-link" href="#" target="_blank" class="discover-toggle-btn wiki-link-styled">
                <span>EXPLORE WIKIPEDIA</span>
                <span>↗</span>
            </a>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
