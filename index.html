<!DOCTYPE html>
<html lang="en" data-theme="nocturne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classics in 7</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Główny kontener aplikacji -->
    <div id="app">
        <!-- Górny pasek nawigacyjny / Menu -->
        <header class="app-header">
            <button id="menu-toggle" aria-label="Toggle Menu">☰</button>
            <h1 id="app-title">Classics in 7</h1>
            <button id="settings-toggle" aria-label="Settings">⚙️</button>
        </header>

        <!-- Widok główny (Treść dnia) -->
        <main class="content-container">
            <section id="daily-card" class="card">
                <span id="tag-discover" class="badge">DISCOVER MORE</span>
                <h2 id="piece-title">Ładowanie...</h2>
                <p id="piece-composer"></p>
                
                <!-- Sekcja audio / odtwarzacz -->
                <div class="player-wrapper">
                    <button id="play-btn">▶ Play (7 min)</button>
                </div>

                <!-- Sekcja historyczna -->
                <div class="history-anchor">
                    <h3 id="did-you-know-title">Did you know?</h3>
                    <p id="history-text">...</p>
                </div>
            </section>
        </main>

        <!-- Slide-over: About & Support (Podzielone na 3 elementy) -->
        <aside id="about-panel" class="slide-panel hidden">
            <div class="panel-header">
                <h2>About & Support</h2>
                <button id="close-about">✕</button>
            </div>
            <div class="panel-content">
                <!-- 1. Author's Note -->
                <div class="about-section-block">
                    <h3 id="heading-author" class="section-subheading">1. Author's Note</h3>
                    <div id="about-author" class="author-text"></div>
                </div>

                <!-- 2. About the App -->
                <div class="about-section-block">
                    <h3 id="heading-manifest" class="section-subheading">2. About the App</h3>
                    <div id="about-manifest" class="manifest-text"></div>
                </div>

                <!-- 3. Support & Feedback -->
                <div class="about-section-block">
                    <h3 id="heading-support" class="section-subheading">3. Support & Feedback</h3>
                    <div class="support-links">
                        <a id="support-link" href="#" target="_blank" class="cta-btn"></a>
                        <a id="feedback-link" href="#" target="_blank" class="cta-btn"></a>
                        <button id="share-btn" class="cta-btn"></button>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- Skrypt inicjalizujący -->
    <script src="app.js"></script>
</body>
</html>
