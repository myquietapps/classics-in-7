<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classics in 7</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-container">
        <div class="card">
            <div id="anchor-badge"></div>
            <h1 id="composer-name"></h1>
            <div id="composer-meta"></div>
            <div id="event-note" style="display: none;"></div>

            <!-- Główny blok utworu (Utwór #1 ze złotą ramką) -->
            <div class="main-track-card">
                <div class="track-header">
                    <span class="track-rank">#1</span>
                    <h3 class="track-title" id="track-title"></h3>
                </div>
                <div class="mood-tags-container" id="track-mood-container">
                    <span class="mood-tag" id="track-mood"></span>
                </div>
                <p class="track-fact" id="track-fact"></p>

                <!-- Matryca przycisków 2x2 pod głównym utworem -->
                <div class="actions-grid-2x2">
                    <button class="btn-slot" id="btn-1">Button 1</button>
                    <button class="btn-slot" id="btn-2">Button 2</button>
                    <button class="btn-slot" id="btn-3">Button 3</button>
                    <button class="btn-slot" id="btn-4">Button 4</button>
                </div>
            </div>

            <!-- Kontener na pozostałe utwory / Discover More -->
            <div id="tracks-container"></div>

            <!-- Przycisk Wikipedii (wyrównany do lewej) -->
            <a id="wiki-link" href="#" target="_blank" class="wiki-footer-btn">Explore Wikipedia</a>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
