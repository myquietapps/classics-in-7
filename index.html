<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classics in 7</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="card">
            <div class="date-header">Born today</div>
            
            <h1 id="track-title">♪ Loading...</h1>
            
            <div class="composer-wrapper">
                <span id="track-composer">Claude Debussy</span>
                <span class="country-tag" id="track-country">[FR]</span>
                <span id="track-duration" class="duration-tag">(4:30)</span>
            </div>

            <div class="tags-container">
                <span class="mood-tag" id="track-mood1">#Melancholic</span>
                <span class="mood-tag" id="track-mood2">#Relaxing</span>
            </div>

            <div class="actions">
                <a href="#" id="spotify-link" class="btn spotify" target="_blank">Spotify</a>
                <a href="#" id="youtube-link" class="btn youtube" target="_blank">YouTube</a>
                <button class="btn fav-btn" title="Add to favorites">♥</button>
            </div>

            <div class="fact-card">
                <div class="fact-title">Did you know?</div>
                <p id="fact-text">Loading fact...</p>
                <div class="fact-voting">
                    <span>Was this interesting?</span>
                    <button class="vote-btn" onclick="vote(true)">👍</button>
                    <button class="vote-btn" onclick="vote(false)">👎</button>
                </div>
            </div>

            <div class="discover-card" id="discoverCard">
                <div class="discover-header" onclick="toggleDiscover()">
                    <span id="discover-arrow">▶</span> DISCOVER MORE
                </div>
                <div class="top5-list" id="top5List">
                </div>
            </div>
        </div>
    </main>

    <script>
        const tracksData = [
            {
                id: 0,
                title: "Clair de Lune",
                composer: "Claude Debussy",
                country: "[FR]",
                duration: "(4:30)",
                moods: ["#Melancholic", "#Relaxing"],
                fact: "Debussy wrote this piece during a period of intense financial struggle, yet it remains his most peaceful work.",
                spotify: "https://open.spotify.com/",
                youtube: "https://youtube.com/",
                youtubeViews: 85000000
            },
            {
                id: 1,
                title: "Rêverie",
                composer: "Claude Debussy",
                country: "[FR]",
                duration: "(4:10)",
                moods: ["#Dreamy", "#Relaxing"],
                fact: "Rêverie was initially disliked by its publisher, prompting Debussy to call it a poor composition.",
                spotify: "https://open.spotify.com/",
                youtube: "https://youtube.com/",
                youtubeViews: 15000000
            },
            {
                id: 2,
                title: "Arabesque No. 1",
                composer: "Claude Debussy",
                country: "[FR]",
                duration: "(5:00)",
                moods: ["#Lively", "#Flowing"],
                fact: "This piece reflects flowing natural lines inspired by Art Nouveau patterns.",
                spotify: "https://open.spotify.com/",
                youtube: "https://youtube.com/",
                youtubeViews: 42000000
            },
            {
                id: 3,
                title: "La Fille aux Cheveux de Lin",
                composer: "Claude Debussy",
                country: "[FR]",
                duration: "(2:30)",
                moods: ["#Soft", "#Melancholic"],
                fact: "The title translates to 'The Girl with the Flaxen Hair' and was inspired by a poem.",
                spotify: "https://open.spotify.com/",
                youtube: "https://youtube.com/",
                youtubeViews: 12000000
            },
            {
                id: 4,
                title: "Golliwogg's Cakewalk",
                composer: "Claude Debussy",
                country: "[FR]",
                duration: "(3:00)",
                moods: ["#Playful", "#Lively"],
                fact: "Debussy playfully parodied Wagner's famous Tristan chord right in the middle of this piece.",
                spotify: "https://open.spotify.com/",
                youtube: "https://youtube.com/",
                youtubeViews: 8000000
            },
            {
                id: 5,
                title: "Danse sacrée et profane",
                composer: "Claude Debussy",
                country: "[FR]",
                duration: "(4:45)",
                moods: ["#Deep", "#Dreamy"],
                fact: "Commissioned to showcase a newly invented chromatic harp.",
                spotify: "https://open.spotify.com/",
                youtube: "https://youtube.com/",
                youtubeViews: 5000000
            }
        ];

        let currentTrackId = null;
        let userMoodPreferences = {
            "#Melancholic": 2,
            "#Relaxing": 2,
            "#Dreamy": 1,
            "#Lively": 1,
            "#Soft": 1,
            "#Playful": 1,
            "#Deep": 1,
            "#Flowing": 1
        };

        let lastVotedTrackId = null;

        function toggleDiscover() {
            const list = document.getElementById('top5List');
            const arrow = document.getElementById('discover-arrow');
            if (list.style.display === 'flex') {
                list.style.display = 'none';
                arrow.textContent = '▶';
            } else {
                updateDiscoverList();
                list.style.display = 'flex';
                arrow.textContent = '▼';
            }
        }

        function selectTrack(id) {
            const track = tracksData.find(t => t.id === id);
            if (!track) return;

            currentTrackId = track.id;

            document.getElementById('track-title').textContent = "♪ " + track.title;
            document.getElementById('track-composer').textContent = track.composer;
            document.getElementById('track-country').textContent = track.country;
            document.getElementById('track-duration').textContent = track.duration;
            
            document.getElementById('track-mood1').textContent = track.moods[0];
            document.getElementById('track-mood2').textContent = track.moods[1] || "";

            document.getElementById('fact-text').textContent = track.fact;

            document.getElementById('spotify-link').href = track.spotify;
            document.getElementById('youtube-link').href = track.youtube;

            document.getElementById('top5List').style.display = 'none';
            document.getElementById('discover-arrow').textContent = '▶';
        }

        function vote(isUp) {
            // Prevent duplicate voting for the same track fact in a row
            if (lastVotedTrackId === currentTrackId) return;

            const currentTrack = tracksData.find(t => t.id === currentTrackId);
            if (!currentTrack) return;

            if (isUp) {
                // Boost mood preferences on positive feedback
                currentTrack.moods.forEach(mood => {
                    if (userMoodPreferences[mood] !== undefined) {
                        userMoodPreferences[mood] += 2;
                    } else {
                        userMoodPreferences[mood] = 2;
                    }
                });
            } else {
                // Slightly reduce mood preferences on negative feedback
                currentTrack.moods.forEach(mood => {
                    if (userMoodPreferences[mood] !== undefined) {
                        userMoodPreferences[mood] = Math.max(0, userMoodPreferences[mood] - 1);
                    }
                });
            }

            lastVotedTrackId = currentTrackId;
        }

        function updateDiscoverList() {
            const listContainer = document.getElementById('top5List');
            listContainer.innerHTML = '';

            let availableTracks = tracksData.filter(t => t.id !== currentTrackId);

            availableTracks.forEach(track => {
                let score = 0;
                track.moods.forEach(mood => {
                    score += (userMoodPreferences[mood] || 0);
                });
                track.matchScore = score;
            });

            availableTracks.sort((a, b) => b.matchScore - a.matchScore);
            const topTracks = availableTracks.slice(0, 5);

            topTracks.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = 'top5-item';
                item.onclick = () => selectTrack(track.id);

                item.innerHTML = `
                    <span class="top5-title">${index + 1}. ${track.title}</span>
                    <span class="top5-meta">${track.duration} <span class="mood-tag">${track.moods[0]}</span></span>
                `;
                listContainer.appendChild(item);
            });
        }

        function initApp() {
            const mostPopularTrack = tracksData.reduce((prev, current) => 
                (prev.youtubeViews > current.youtubeViews) ? prev : current
            );
            selectTrack(mostPopularTrack.id);
        }

        initApp();
    </script>
</body>
</html>
