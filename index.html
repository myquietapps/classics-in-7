<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classics in 7</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <button id="menu-toggle" aria-label="Open Menu" class="icon-btn">☰</button>
        <h1 class="app-title">Classics in 7</h1>
        <!-- USUNIĘTO: Przycisk wyszukiwania i koło zębate -->
    </header>

    <nav id="hamburger-menu" class="drawer hidden" aria-label="Main Navigation">
        <div class="drawer-header">
            <h2>Menu</h2>
            <button id="menu-close" aria-label="Close Menu" class="icon-btn">&times;</button>
        </div>
        <ul class="menu-list">
            <li><a href="#home" data-view="home" class="active">Today's Masterpiece</a></li>
            <li><a href="#saved" data-view="saved">Saved Classics</a></li>
            <li><a href="#stats" data-view="stats">My Mood Stats</a></li>
            <li><a href="#jump" data-view="jump">Jump to Date</a></li>
            <li><a href="#reminder" data-view="reminder">Daily Reminder</a></li>
            <li><a href="#appearance" data-view="appearance">Appearance</a></li>
            <li><a href="#about" data-view="about">About</a></li>
        </ul>
        <div class="drawer-footer"><small>v1.0.0</small></div>
    </nav>

    <div id="drawer-backdrop" class="backdrop hidden"></div>

    <main id="app-content">
        <!-- HOME VIEW (Główny widok) -->
        <section id="view-home" class="view-section active">
            
            <!-- Nawigacja datą (wspólna dla obu scenariuszy) -->
            <div class="date-navigation">
                <button id="nav-prev" class="icon-btn">◀</button>
                <h2 id="current-date-display">Loading...</h2>
                <button id="nav-next" class="icon-btn">▶</button>
            </div>

            <!-- Kontener dynamiczny, który będzie wypełniany przez app.js -->
            <div id="dynamic-content-area">
                <!-- Tu zostanie wstrzyknięty HTML dla Case 1 lub Case 2 -->
            </div>

            <!-- Element microlearningu (Classical Insight) - Wyświetlany zawsze na dole -->
            <div id="daily-insight-container" class="insight-card card">
                Loading Classical Insight...
            </div>

        </section>

        <!-- Pozostałe sekcje (Saved, Stats, Jump, Reminder, Appearance, About) bez zmian w strukturze -->
        <section id="view-saved" class="view-section">
            <h2>Saved Classics</h2>
            <div class="filter-bar">
                <input type="text" id="saved-search" placeholder="Filter by composer or mood...">
            </div>
            <div id="saved-list-container"></div>
        </section>
        <section id="view-stats" class="view-section">...</section>
        <section id="view-jump" class="view-section">...</section>
        <section id="view-reminder" class="view-section">...</section>
        <section id="view-appearance" class="view-section">...</section>
        <section id="view-about" class="view-section">...</section>
    </main>

    <!-- Ładowanie zewnętrznych baz danych i logiki -->
    <script src="base_1.js"></script> <!-- Ciekawostki -->
    <script src="base_2.js"></script> <!-- Baza kompozytorów -->
    <script src="app.js"></script>     <!-- Główna logika -->
</body>
</html>
